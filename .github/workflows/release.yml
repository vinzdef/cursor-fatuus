# Push a tag like v1.0.0 to build, sign and notarize the universal DMG and publish it as a release.
# Secrets: CERT_P12 (base64 Developer ID .p12), CERT_PASSWORD, APPLE_ID, APPLE_APP_PASSWORD.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      SIGN_ID: "Developer ID Application: Vincent De Feo (9BHQLQK56K)"
      TEAM_ID: 9BHQLQK56K
    steps:
      - uses: actions/checkout@v4

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          # The .p12 holds only the leaf; codesign also needs Apple's Developer ID G2 intermediate.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build, sign and notarize DMG
        working-directory: macos
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          make notarize ARCHS="--arch arm64 --arch x86_64" VERSION="${GITHUB_REF_NAME#v}" SIGN_ID="$SIGN_ID" \
            NOTARY_ARGS="--apple-id $APPLE_ID --team-id $TEAM_ID --password $APPLE_APP_PASSWORD"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" macos/build/CursorFatuus.dmg --title "Cursor Fatuus $GITHUB_REF_NAME" --generate-notes

      - name: Remove keychain
        if: always()
        run: '[ -n "$KEYCHAIN" ] && security delete-keychain "$KEYCHAIN" || true'
